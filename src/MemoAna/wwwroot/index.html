    <div class="status-bar-safe-area"></div>
    <div id="app">
        <style>
            @keyframes slide {
                0% {
                    transform: translateX(-25%) ;
                } 
                100% {
                    transform: translateX(25%);
                }
            }

            .mud-wasm {
                animation: slide 3s ease-in-out infinite alternate;
                background-image: linear-gradient(-60deg,#1E88E5 50%,#0069c0 50%);
                bottom: 0;
                left: -50%;
                opacity: .5;
                position: fixed;
                right: -50%;
                top: 0;
                z-index: -1
            }

            .mud-wasm-cont {
                left: 50%;
                padding: 10vmin;
                position: fixed;
                text-align: center;
                top: 50%;
                transform: translate(-50%,-50%)
            }
            .mud-root{
                height:100%;
                width:100%;
                margin:0;
                position:fixed;
            }
            .mud-animation-duration {
                animation-duration:5s;
            }
            .mud-first-animation {
                animation-direction: alternate-reverse;
                animation-duration:4s;
            }
        </style>

        <div class="mud-root">
            <div class="mud-wasm"></div>
            <div class="mud-wasm mud-first-animation" ></div>
            <div class="mud-wasm mud-animation-duraation" ></div>
