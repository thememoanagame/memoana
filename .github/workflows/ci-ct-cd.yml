name: Continuous [Integration | Testing | Deployment]

on:
  push:
    branches: [ main ] 
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: write 
  
jobs:
  mobile-integration-test:
    name: Mobile (${{ matrix.workload }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_framework: net10.0-android
            os: windows-latest
            workload: android
          - target_framework: net10.0-windows10.0.19041.0
            os: windows-latest
            workload: windows
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        if: matrix.target_framework == 'net10.0-ios' 
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Setup Java JDK
        if: matrix.target_framework == 'net10.0-android'
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        working-directory: ${{ github.workspace }}/src/MemoAna/
        run: dotnet workload restore

      - name: Restore dependencies
        working-directory: ${{ github.workspace }}/src/MemoAna
        run: dotnet restore 

      - name: Build MAUI Project
        working-directory: ${{ github.workspace }}/src/MemoAna/ 
        run: dotnet build -c Release -f ${{ matrix.target_framework }}
